name: sdr
version: 1.5.0
description: Spec-Driven Running
author: Greg Balnis
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, grok-bot, grok-build, hermes, kiro, opencode, vscode, windsurf
targets:
- copilot
- vscode
dependencies:
  apm: []
  mcp: 
    - name: intervals-icu-mcp
      registry: false
      transport: stdio
      command: uvx
      args: ["intervals-icu-mcp"]
      env: {
        "ENV_FILE": "/workspaces/sdr/.env"
      }
includes: auto
scripts: {}
